<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Campus Fest 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2>🎓 Campus Fest 2026</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="registration.html">Registration</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section>

            <h2>College Festival Office</h2>

            <p><strong>📍 Address:</strong> College Campus, Main Road</p>

            <p><strong>📞 Phone:</strong> +91 98765 43210</p>

            <p><strong>📧 Email:</strong> campusfest@example.com</p>

        </section>


        <section>

            <h2>Send Us an Enquiry</h2>

            <form id="contactForm">

                <label for="contactName">Name</label>
                <input type="text" id="contactName" name="contactName">

                <label for="contactEmail">Email</label>
                <input type="email" id="contactEmail" name="contactEmail">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Send Message</button>

                <p id="contactMessage"></p>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 Campus Fest | College Event Portal</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
